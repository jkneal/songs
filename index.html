<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unnamed Band</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="background-overlay">
        <div class="sound-waves"></div>
    </div>
    
    <header class="header">
        <h1 class="logo">Unnamed</h1>
        <p class="tagline">Song starters for, you know, a band.</p>
    </header>
    
    <div class="main-container">
        <section class="playlist-section">
            <ul class="playlist" id="playlist">
                <!-- Tracks will be dynamically generated here -->
            </ul>
            
            <div class="player-controls">
                <div class="now-playing">
                    <div class="wave-indicator">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                    <span class="now-playing-text">Select a track</span>
                </div>

                <div class="control-buttons">
                    <button class="control-btn" id="prev-btn">⏮</button>
                    <button class="control-btn primary" id="play-pause-btn">▶</button>
                    <button class="control-btn" id="next-btn">⏭</button>
                    <button class="control-btn loop-clear" id="clear-loop-btn" title="Clear section loop" style="display: none;">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"/>
                            <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 4.9 4c1.552 0 2.94-.707 3.857-1.818a.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"/>
                            <path d="M8 8l2-2m-2 2l-2-2m2 2v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                        </svg>
                    </button>
                    <span class="loop-section-text" id="loop-section-text" style="display: none;"></span>
                </div>
                
                <div class="progress-container">
                    <span class="time" id="current-time">0:00</span>
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span class="time" id="duration">0:00</span>
                </div>
            </div>
        </section>
        
        <section class="lyrics-panel" id="lyrics-panel">
            <div class="lyrics-header">
                <h3 class="lyrics-title">Lyrics</h3>
                <button class="lyrics-close" id="lyrics-close">✕</button>
            </div>
            <div class="lyrics-content" id="lyrics-content">
                <p class="lyrics-placeholder">Select a song with lyrics to display</p>
            </div>
        </section>

        <section class="structure-panel" id="structure-panel">
            <div class="structure-header">
                <h3 class="structure-title">Song Structure</h3>
                <button class="structure-close" id="structure-close">✕</button>
            </div>
            <div class="structure-content" id="structure-content">
                <p class="structure-placeholder">Select a song with structure to display</p>
            </div>
        </section>
    </div>
    
    <script src="config.js"></script>
    <script src="index.js"></script>
</body>
</html>
